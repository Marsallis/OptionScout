name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t optionscout:ci .
      - name: Non-interactive setup
        run: sh scripts/setup.sh --container optionscout-ci | tee /tmp/setup.out
      - name: Success text uses the requested container name
        run: grep -F 'optionscout-ci' /tmp/setup.out
