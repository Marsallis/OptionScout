# Local-only OptionScout. The published port is bound to loopback.
# Inside the container the process listens on 0.0.0.0 so Docker can forward
# traffic; that interface is not published to the LAN.

name: optionscout

services:
  optionscout:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${OPTIONSCOUT_IMAGE:-optionscout:1b}
    # Default name keeps the existing local container. A second copy can set
    # OPTIONSCOUT_CONTAINER and OPTIONSCOUT_PORT without touching that volume.
    container_name: ${OPTIONSCOUT_CONTAINER:-optionscout}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPTIONSCOUT_PORT:-3180}:3180"
    volumes:
      - optionscout-data:/data
      - ./secrets:/run/secrets:ro
    environment:
      NODE_ENV: production
      PORT: "3180"
      BIND_HOST: 0.0.0.0
      DATABASE_PATH: /data/optionscout.sqlite
      DATA_MODE: demo
      AUTH_MODE: local-owner
      ENABLE_ORDER_EXECUTION: "false"
      TELEMETRY_ENABLED: "false"
      RUNNING_IN_DOCKER: "true"
      STATIC_DIR: /app/apps/web/dist
      # Public defaults are off. A fresh install must not require brokerage
      # credentials and must not call the provider at startup. Set these to
      # "true" in a local .env only after secrets/tastytrade.env is complete.
      # Startup still does not scan or sync.
      FINDER_LIVE_SCAN: "${FINDER_LIVE_SCAN:-false}"
      SMART_SCAN_LIVE: "${SMART_SCAN_LIVE:-false}"
      TASTYTRADE_ENABLE_LIVE: "${TASTYTRADE_ENABLE_LIVE:-false}"
      TASTYTRADE_SCHEDULED_SYNC: "false"
      TASTYTRADE_TRANSACTION_LOOKBACK_DAYS: "365"
      TASTYTRADE_SECRET_FILE: /run/secrets/tastytrade.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3180/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  optionscout-data:
